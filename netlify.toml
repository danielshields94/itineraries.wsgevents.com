# One Netlify site that hosts many sub-projects as plain folders.
# Anything inside /public is served as-is: public/volleyball-2026/foo/index.html -> /volleyball-2026/foo
[build]
  publish = "public"
  # No build step needed. If you start generating pages on deploy, use:
  # command = "node tools/build-itineraries.mjs"

# Keep every page out of search engines (sub-projects are shared by link only).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Shared assets can be cached; HTML stays fresh so edits show up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Old links (/itineraries/...) permanently redirect to the new short links.
[[redirects]]
  from = "/itineraries/*"
  to = "/:splat"
  status = 301
  force = true   # applies even if an old copy of the /itineraries folder is still in the repo

# Event folders aren't public listings - send them to the homepage.
# Add one of these for each new event folder.
[[redirects]]
  from = "/volleyball-2026"
  to = "/"
  status = 302
